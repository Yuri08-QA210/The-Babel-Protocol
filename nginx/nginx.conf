        }

        # ============================================================
        # Additional decoy / red herring paths
        # ============================================================

        # robots.txt — reveals interesting but misleading paths
        location /robots.txt {
            proxy_pass http://backend_stage1;
            proxy_set_header Host $host;
        }

        # Sitemap (decoy)
        location /sitemap.xml {
