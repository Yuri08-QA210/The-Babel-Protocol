# ============================================================
# QA CTF Challenge — Nginx Reverse Proxy Configuration
# ============================================================
# INTENTIONALLY VULNERABLE: HTTP Request Smuggling (TE.TE variant)
#
# Vulnerability: Nginx and backend disagree on how to parse
# obfuscated Transfer-Encoding headers.
#
# Nginx behavior: Recognizes "Transfer-Encoding: chunked"
#   but IGNORES Transfer-Encoding if the header value has
#   unusual casing, extra whitespace, or non-standard formatting.
#   Specifically, Nginx treats "Transfer-Encoding : chunked"
#   (with space before colon) as an invalid header and ignores it.
#
# Backend behavior: Flask/Werkzeug parses headers more liberally
#   and may accept the obfuscated TE header, treating it as
#   chunked encoding.
#
# This mismatch enables TE.TE smuggling.
# ============================================================

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/json;

    # Logging — minimal to avoid leaking challenge info
    log_format minimal '$remote_addr - [$time_local] "$request" $status';
    access_log /var/log/nginx/access.log minimal;

    # ============================================================
    # Upstream: Backend application (all stages)
    # ============================================================
    upstream backend_stage1 {
        server 127.0.0.1:5000;
    }

    upstream backend_stage2 {
        server 127.0.0.1:5001;
    }

    upstream backend_stage3 {
        server 127.0.0.1:5002;
    }

    # ============================================================
    # Rate limiting — but with intentional gaps for smuggling
    # ============================================================
    limit_req_zone $binary_remote_addr zone=general:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=vault:10m rate=5r/s;
    limit_req_zone $binary_remote_addr zone=login:10m rate=2r/s;

    # ============================================================
    # WAF-like rules — block common attack patterns
    # But smuggled requests bypass these checks
    # ============================================================

    # Block requests with suspicious headers (but smuggled requests
    # may contain these headers in the smuggled portion)
    map $http_x_internal_token $block_internal {
        "default" 0;
        "~.+" 1;  # Block if X-Internal-Token is set in normal requests
    }

    # ============================================================
    # Server Block
    # ============================================================
    server {
        listen 80;
        server_name _;

        # Maximum body size
        client_max_body_size 10m;

        # Hide server version
        server_tokens off;

        # Security headers (cosmetic — bypassable via smuggling)
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-XSS-Protection "1; mode=block" always;

        # ============================================================
        # Stage 1: XML Processor (Wasm + XXE + SSRF)
        # ============================================================
        location /api/parse {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://backend_stage1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/search {
            limit_req zone=api burst=10 nodelay;
            proxy_pass http://backend_stage1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/health {
            proxy_pass http://backend_stage1;
            proxy_set_header Host $host;
        }

        location /api/status {
            proxy_pass http://backend_stage1;
            proxy_set_header Host $host;
        }

        # ============================================================
        # Stage 2: User Portal (SSTI)
        # ============================================================
        location /portal/ {
            limit_req zone=general burst=20 nodelay;
            rewrite ^/portal/(.*) /$1 break;
            proxy_pass http://backend_stage2;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /portal/login {
            limit_req zone=login burst=5 nodelay;
            rewrite ^/portal/(.*) /$1 break;
            proxy_pass http://backend_stage2;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # ============================================================
        # Stage 3: Vault Backend (Smuggling + Race Condition)
        # ============================================================
        # VULNERABLE CONFIGURATION:
        # The proxy_pass to stage3 backend is susceptible to TE.TE smuggling
        # because Nginx and Flask handle Transfer-Encoding differently.

        location /api/vault/ {
            limit_req zone=vault burst=5 nodelay;

            # WAF check: Block X-Internal-Token in normal requests
            if ($block_internal) {
                return 200 '{"status":"ok","message":"Request processed"}';
            }

            proxy_pass http://backend_stage3;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # VULNERABILITY: proxy_http_version 1.1 with Connection ""
            # This allows request smuggling when Transfer-Encoding header
            # is obfuscated (space before colon)
            # Nginx ignores "Transfer-Encoding : chunked" (space before colon)
            # but the backend parses it as valid chunked encoding.
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # Vault Dashboard UI
        location /vault/ {
            limit_req zone=general burst=20 nodelay;
            rewrite ^/vault/(.*) /$1 break;
            proxy_pass http://backend_stage3;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /admin/vault {
            limit_req zone=vault burst=5 nodelay;

            # Block direct access to admin vault from external
            # Only accessible via smuggled requests that bypass this check
            set $allow_access 0;
            if ($http_x_real_ip = "127.0.0.1") {
                set $allow_access 1;
            }

            proxy_pass http://backend_stage3;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # VULNERABILITY: Same TE.TE smuggling vector
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # ============================================================
        # Rabbit Hole Locations — All proxy to stage1 with fake responses
        # These are distractions / red herrings for CTF players
        # ============================================================

        # Admin panel (decoy)
        location /admin/ {
            proxy_pass http://backend_stage1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Debug panel (decoy)
        location /debug/ {
            proxy_pass http://backend_stage1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Console (decoy)
        location /console/ {
            proxy_pass http://backend_stage1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # GraphQL endpoint (decoy)
        location /graphql {
            proxy_pass http://backend_stage1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # WordPress admin (decoy)
        location /wp-admin/ {
            proxy_pass http://backend_stage1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # phpMyAdmin (decoy)
        location /phpmyadmin/ {
            proxy_pass http://backend_stage1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Well-known (decoy — might look like security misconfiguration)
        location /.well-known/ {
            proxy_pass http://backend_stage1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Monitoring (decoy)
        location /monitoring/ {
            proxy_pass http://backend_stage1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Prometheus metrics (decoy)
        location /prometheus/ {
            proxy_pass http://backend_stage1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Grafana dashboard (decoy)
        location /grafana/ {
