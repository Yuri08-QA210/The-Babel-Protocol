# ============================================================
# Babel Protocol — Nginx Reverse Proxy Configuration
# ============================================================
# Enterprise XML Processing Platform

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/json;

    # Logging — minimal to avoid leaking challenge info
    log_format minimal '$remote_addr - [$time_local] "$request" $status';
    access_log /var/log/nginx/access.log minimal;

    # ============================================================
    # Upstream: Backend application (all stages)
    # ============================================================
    upstream backend_stage1 {
        server 127.0.0.1:5000;
    }

    upstream backend_stage2 {
        server 127.0.0.1:5001;
    }

    upstream backend_stage3 {
        server 127.0.0.1:5002;
    }

    # ============================================================
    # Rate limiting zones
    # ============================================================
    limit_req_zone $binary_remote_addr zone=general:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=vault:10m rate=5r/s;
    limit_req_zone $binary_remote_addr zone=login:10m rate=2r/s;

    # ============================================================
    # Security rules
    # ============================================================

    # Block internal headers from external requests
    map $http_x_internal_token $block_internal {
        "default" 0;
        "~.+" 1;  # Block if X-Internal-Token is set in normal requests
    }

    # ============================================================
    # Server Block
    # ============================================================
    server {
        listen 80;
        server_name _;

        # Maximum body size
        client_max_body_size 10m;

        # Hide server version
        server_tokens off;

        # Security headers
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-XSS-Protection "1; mode=block" always;

        # ============================================================
        # XML Processing API
        # ============================================================
        location /api/parse {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://backend_stage1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/search {
            limit_req zone=api burst=10 nodelay;
            proxy_pass http://backend_stage1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/health {
            proxy_pass http://backend_stage1;
            proxy_set_header Host $host;
        }

        location /api/status {
            proxy_pass http://backend_stage1;
            proxy_set_header Host $host;
        }

        # ============================================================
        # User Portal
        # ============================================================
        location /portal/ {
            limit_req zone=general burst=20 nodelay;
            rewrite ^/portal/(.*) /$1 break;
            proxy_pass http://backend_stage2;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /portal/login {
            limit_req zone=login burst=5 nodelay;
            rewrite ^/portal/(.*) /$1 break;
            proxy_pass http://backend_stage2;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # ============================================================
        # Infrastructure Backend
        # ============================================================

        location /api/vault/ {
            limit_req zone=vault burst=5 nodelay;

            # WAF check
            if ($block_internal) {
                return 200 '{"status":"ok","message":"Request processed"}';
            }

            proxy_pass http://backend_stage3;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # HTTP/1.1 keep-alive for backend connections
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # Vault Dashboard
        location /vault/ {
            limit_req zone=general burst=20 nodelay;
            rewrite ^/vault/(.*) /$1 break;
            proxy_pass http://backend_stage3;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /admin/vault {
            limit_req zone=vault burst=5 nodelay;

            # Block direct access to admin vault from external
            # Internal access only
            set $allow_access 0;
            if ($http_x_real_ip = "127.0.0.1") {
                set $allow_access 1;
            }

            proxy_pass http://backend_stage3;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # HTTP/1.1 keep-alive
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # ============================================================
        # Additional service locations
        # ============================================================

        # Admin panel
        location /admin/ {
            proxy_pass http://backend_stage1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Debug panel
        location /debug/ {
            proxy_pass http://backend_stage1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Console
        location /console/ {
            proxy_pass http://backend_stage1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # GraphQL endpoint
        location /graphql {
            proxy_pass http://backend_stage1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # WordPress admin
        location /wp-admin/ {
            proxy_pass http://backend_stage1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # phpMyAdmin
        location /phpmyadmin/ {
            proxy_pass http://backend_stage1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Well-known
        location /.well-known/ {
            proxy_pass http://backend_stage1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Monitoring
        location /monitoring/ {
            proxy_pass http://backend_stage1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Prometheus metrics
        location /prometheus/ {
            proxy_pass http://backend_stage1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Grafana dashboard
        location /grafana/ {
            proxy_pass http://backend_stage1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Jenkins CI
        location /jenkins/ {
            proxy_pass http://backend_stage1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # CI
        location /ci/ {
            proxy_pass http://backend_stage1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Git repository
        location /git/ {
            proxy_pass http://backend_stage1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # SVN repository
        location /svn/ {
            proxy_pass http://backend_stage1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Backup directory
        location /backup/ {
            proxy_pass http://backend_stage1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Static files
        location /static/ {
            proxy_pass http://backend_stage1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Assets
        location /assets/ {
            proxy_pass http://backend_stage1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # API v1 (legacy)
        location /api/v1/ {
            proxy_pass http://backend_stage1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # API v2 (legacy)
        location /api/v2/ {
            proxy_pass http://backend_stage1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Internal API
        location /api/internal/ {
            proxy_pass http://backend_stage1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Internal
        location /internal/ {
            proxy_pass http://backend_stage1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Private
        location /private/ {
            proxy_pass http://backend_stage1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Secret
        location /secret/ {
            proxy_pass http://backend_stage1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Test environment
        location /test/ {
            proxy_pass http://backend_stage1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Dev environment
        location /dev/ {
            proxy_pass http://backend_stage1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Staging environment
        location /staging/ {
            proxy_pass http://backend_stage1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Demo environment
        location /demo/ {
            proxy_pass http://backend_stage1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Documentation
        location /docs/ {
            proxy_pass http://backend_stage1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # API Documentation
        location /api-docs/ {
            proxy_pass http://backend_stage1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Swagger UI
        location /swagger/ {
            proxy_pass http://backend_stage1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # ============================================================
        # Additional paths
        # ============================================================

        # robots.txt
        location /robots.txt {
            proxy_pass http://backend_stage1;
            proxy_set_header Host $host;
        }

        # Sitemap
        location /sitemap.xml {
            proxy_pass http://backend_stage1;
            proxy_set_header Host $host;
        }

        # Favicon
        location /favicon.ico {
            proxy_pass http://backend_stage1;
            proxy_set_header Host $host;
        }

        # .env file
        location /.env {
            proxy_pass http://backend_stage1;
            proxy_set_header Host $host;
        }

        # .git directory
        location /.git/ {
            proxy_pass http://backend_stage1;
            proxy_set_header Host $host;
        }

        # Server-status
        location /server-status {
            proxy_pass http://backend_stage1;
            proxy_set_header Host $host;
        }

        # Default location — catch-all
        location / {
            limit_req zone=general burst=20 nodelay;
            proxy_pass http://backend_stage1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }
    }
}
