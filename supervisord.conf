[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
childlogdir=/var/log/supervisor
user=root

# ============================================================
# Internal Service (SSRF target — must start first)
# ============================================================
[program:internal-service]
command=python3 app.py
directory=/app/internal-service
environment=INTERNAL_PORT="8888",SECRET_KEY_PART1="%(ENV_SECRET_KEY_PART1)s",SECRET_KEY_PART2="%(ENV_SECRET_KEY_PART2)s"
stdout_logfile=/var/log/supervisor/internal-service.log
stderr_logfile=/var/log/supervisor/internal-service-error.log
autostart=true
autorestart=true
startsecs=2
priority=10

# ============================================================
# Stage 1: Wasm + XXE + SSRF
# ============================================================
[program:stage1-app]
command=python3 app.py
directory=/app/stage1-wasm-xxe
environment=STAGE1_FLAG="%(ENV_STAGE1_FLAG)s",SECRET_KEY_PART1="%(ENV_SECRET_KEY_PART1)s",FLASK_SECRET_KEY="%(ENV_FLASK_SECRET_KEY)s",INTERNAL_SERVICE_HOST="%(ENV_INTERNAL_SERVICE_HOST)s",INTERNAL_SERVICE_PORT="%(ENV_INTERNAL_SERVICE_PORT)s"
stdout_logfile=/var/log/supervisor/stage1.log
stderr_logfile=/var/log/supervisor/stage1-error.log
autostart=true
autorestart=true
startsecs=3
priority=20

# ============================================================
# Stage 2: Secret Key + SSTI
# ============================================================
[program:stage2-app]
command=python3 app.py
directory=/app/stage2-ssti
environment=STAGE2_FLAG="%(ENV_STAGE2_FLAG)s",SECRET_KEY_PART1="%(ENV_SECRET_KEY_PART1)s",SECRET_KEY_PART2="%(ENV_SECRET_KEY_PART2)s",ADMIN_PASSWORD="%(ENV_ADMIN_PASSWORD)s",DB_PATH="%(ENV_DB_PATH)s",SESSION_LIFETIME_MINUTES="%(ENV_SESSION_LIFETIME_MINUTES)s",INTERNAL_TOKEN="%(ENV_INTERNAL_TOKEN)s",GRANT_SEED="%(ENV_GRANT_SEED)s"
stdout_logfile=/var/log/supervisor/stage2.log
stderr_logfile=/var/log/supervisor/stage2-error.log
autostart=true
autorestart=true
startsecs=3
priority=30

# ============================================================
# Stage 3: Smuggling + Race Condition
# ============================================================
[program:stage3-app]
command=python3 app.py
directory=/app/stage3-smuggling
environment=FINAL_FLAG="%(ENV_FINAL_FLAG)s",INTERNAL_TOKEN="%(ENV_INTERNAL_TOKEN)s",RACE_WINDOW_MS="%(ENV_RACE_WINDOW_MS)s",FLAG_MEMORY_TTL_MS="%(ENV_FLAG_MEMORY_TTL_MS)s",DB_PATH="%(ENV_DB_PATH)s",GRANT_SEED="%(ENV_GRANT_SEED)s"
stdout_logfile=/var/log/supervisor/stage3.log
stderr_logfile=/var/log/supervisor/stage3-error.log
autostart=true
autorestart=true
startsecs=3
priority=30

# ============================================================
# Nginx (starts last — waits for backends)
# ============================================================
[program:nginx]
command=nginx -g "daemon off;"
stdout_logfile=/var/log/supervisor/nginx.log
stderr_logfile=/var/log/supervisor/nginx-error.log
autostart=true
autorestart=true
startsecs=3
priority=50
